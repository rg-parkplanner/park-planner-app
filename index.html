<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Park planner</title>
<script>window.__planHash = location.hash;  // before Telegram's script, which reads and may rewrite the hash</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Telegram Mini App for the parkcollector day-of planner. Static: the plan arrives in the URL
   fragment (never sent to this host) and choices go back to the bot via WebApp.sendData. */
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --fg: var(--tg-theme-text-color, #16202c);
  --muted: var(--tg-theme-hint-color, #6b7686);
  --card: var(--tg-theme-secondary-bg-color, #f2f4f7);
  --accent: var(--tg-theme-button-color, #2f6fde);
  --on-accent: var(--tg-theme-button-text-color, #ffffff);
  --lo: #2e9b5e; --mid: #d99a1e; --hi: #d1493f; --off: #9aa3af;
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-tg]) {
  --bg: #12161c; --fg: #e8ecf1; --muted: #9aa3af; --card: #1c222b; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--fg); }
.wrap { padding: 12px max(14px, env(safe-area-inset-left)) 28px max(14px, env(safe-area-inset-right));
  display: grid; gap: 12px; max-width: 560px; margin: 0 auto; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.head b { font-size: 17px; } .sub { color: var(--muted); font-size: 13px; }
.card { background: var(--card); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.next { font-size: 17px; font-weight: 600; }
ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.warn { color: var(--hi); font-size: 13px; }
svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select, input[type=time] { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--muted);
  background: var(--bg); color: var(--fg); min-width: 0; }
select { flex: 1 1 100%; }
button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer;
  background: var(--accent); color: var(--on-accent); flex: 1 1 auto; }
button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
#out { font-size: 13px; color: var(--muted); word-break: break-word; }
a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="sub">Loading the plan…</div></div>
<script>
(async function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  // initData is empty when a Mini App is opened from a keyboard button (our "Open planner"), so detect
  // Telegram by its platform instead; sendData works there.
  const inTelegram = !!(tg && tg.platform && tg.platform !== "unknown");
  if (inTelegram) { document.documentElement.setAttribute("data-tg", ""); tg.ready(); tg.expand(); }
  const app = document.getElementById("app");
  const el = (tag, attrs = {}, text) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text != null) n.textContent = text;
    return n;
  };
  const fail = (msg, details) => {
    const card = el("div", { class: "card" }, msg);
    if (details && inTelegram) {  // lets the owner see what this phone actually received
      const b = el("button", {}, "Send details to bot");
      b.onclick = () => tg.sendData("pagedebug " + details);
      card.append(b);
    }
    app.replaceChildren(card);
  };
  const raw = window.__planHash || "";
  const details = () => [`len=${raw.length}`, `head=${raw.slice(0, 24)}`, `p=${raw.indexOf("p=")}`,
    `tgParams=${raw.includes("tgWebApp")}`, `nowHash=${location.hash.length}`, `search=${location.search}`,
    `ds=${typeof DecompressionStream}`, `tg=${tg ? tg.version + "/" + tg.platform : "none"}`].join(" ");

  // The plan is "p" in the URL fragment; Telegram appends its own launch parameters (&tgWebAppData=...).
  function readPayload(hash) {
    const h = (hash || "").replace(/^#/, "");
    const p = new URLSearchParams(h).get("p");
    return p || (h && !h.includes("=") ? h.split("&")[0] : "");
  }
  async function inflateRaw(bytes) {
    if (typeof DecompressionStream !== "undefined") {
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return await new Response(stream).text();
    }
    if (!window.pako) await new Promise((ok, bad) => {  // older phone browsers: a small inflate library
      const sc = document.createElement("script");
      sc.src = "https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako_inflate.min.js";
      sc.onload = ok; sc.onerror = () => bad(new Error("couldn't load the decompressor"));
      document.head.append(sc);
    });
    return window.pako.inflateRaw(bytes, { to: "string" });
  }
  async function decode(frag) {
    const b64 = frag.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((frag.length + 3) % 4);
    const bytes = Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0));
    return JSON.parse(await inflateRaw(bytes));
  }
  const frag = readPayload(window.__planHash || location.hash);
  if (!frag) return fail("Open this page from the planner bot's button: it carries your current plan.", details());
  let D;
  try { D = await decode(frag); } catch (e) {
    return fail(`Couldn't read the plan in this link (${e && e.message ? e.message : e}; ${frag.length} chars). ` +
                "Send plan to the bot for a fresh one.", details() + ` err=${e && e.message ? e.message : e}`);
  }

  const R = D.rides;  // [name, lat, lon, wait, state, flags]
  const send = (cmd) => {
    if (inTelegram) { tg.sendData(cmd); return; }  // the bot replies with a fresh plan; Telegram closes the page
    out.textContent = "Send this to the bot: " + cmd;
  };
  const color = (r) => r[4] !== "O" ? "var(--off)" : r[3] == null ? "var(--muted)" :
    r[3] < 20 ? "var(--lo)" : r[3] < 40 ? "var(--mid)" : "var(--hi)";
  const desc = (r) => r[0] + (r[4] === "D" ? " (down)" : r[4] === "C" ? " (closed)" : r[3] != null ? ` · ${r[3]} min` : "")
    + (r[5].includes("d") ? " · done" : "") + (r[5].includes("h") ? " · holding LL" : "") + (r[5].includes("t") ? " · too tall" : "");

  // header + plan
  const head = el("div", { class: "head" });
  head.append(el("b", {}, { DL: "Disneyland Park", DCA: "Disney California Adventure" }[D.park] || D.park),
              el("span", { class: "sub" }, `${D.time} · lines ${D.ratio.toFixed(2)}× typical`));
  const plan = el("div", { class: "card" });
  if (D.age == null) plan.append(el("div", { class: "warn" }, "No live data yet: waits are typical, not live."));
  else if (D.age > 15) plan.append(el("div", { class: "warn" }, `Live data is ${D.age} min old: waits may have moved.`));
  plan.append(el("div", { class: "next" }, D.steps[0] || "Nothing left that fits before you leave."));
  if (D.steps.length > 1) {
    const ol = el("ol", { start: "2" });
    D.steps.slice(1).forEach((s) => ol.append(el("li", {}, s)));
    plan.append(ol);
  }
  const target = D.next != null ? R[D.next] : null;
  if (target) {
    // Directions on the page itself: maps-app links (Google Maps) redirect to an app scheme that
    // Telegram's in-app browser can't open (ERR_UNKNOWN_URL_SCHEME).
    const from = D.at != null ? R[D.at] : null;
    if (from && from !== target) {
      const rad = Math.PI / 180, dLat = (target[1] - from[1]) * rad, dLon = (target[2] - from[2]) * rad;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(from[1] * rad) * Math.cos(target[1] * rad) * Math.sin(dLon / 2) ** 2;
      const m = 2 * 6371000 * Math.asin(Math.sqrt(h));
      const mins = Math.round(2 + m * 1.4 / 55);  // the planner's pace with a 5-year-old, path detours included
      const y = Math.sin(dLon) * Math.cos(target[1] * rad);
      const x = Math.cos(from[1] * rad) * Math.sin(target[1] * rad) - Math.sin(from[1] * rad) * Math.cos(target[1] * rad) * Math.cos(dLon);
      const dir = ["north", "northeast", "east", "southeast", "south", "southwest", "west", "northwest"][
        Math.round(((Math.atan2(y, x) / rad + 360) % 360) / 45) % 8];
      plan.append(el("div", {}, `To ${target[0]}: about ${Math.round(m / 10) * 10} m, ${mins} min walk, ${dir} of ${from[0]}.`));
    }
    // Google Maps: in Telegram the bot sends a location pin (Telegram's map hands off to Google
    // Maps natively); a plain link would open in Telegram's in-app browser, which can't hand off.
    const gmaps = `https://www.google.com/maps/dir/?api=1&destination=${target[1]},${target[2]}&travelmode=walking`;
    const row = el("div", { class: "row" });
    const go = el("button", {}, `Directions in Google Maps`);
    go.onclick = () => { if (inTelegram) tg.sendData(`where ${target[0]}`); else location.href = gmaps; };
    row.append(go);
    plan.append(row);
    const a = el("a", { href: gmaps, target: "_blank", rel: "noopener", class: "sub" },
                 "Or open the Google Maps link (needs Telegram's in-app browser off)");
    a.onclick = (ev) => { if (inTelegram) { ev.preventDefault(); tg.openLink(a.href); } };
    plan.append(a);
  }
  if (D.held.length) plan.append(el("div", { class: "sub" }, "Holding: " + D.held.map((h) => `${R[h[0]][0]} ${h[1]}–${h[2]}`).join("; ")));
  if (D.nb) plan.append(el("div", { class: "sub" }, `Next Multi Pass booking opens ${D.nb}${D.held.length ? ", or when you tap in" : ""}.`));
  if (D.sold.length) plan.append(el("div", { class: "sub" }, "Multi Pass sold out today: " + D.sold.join(", ")));

  // map: rides projected from lat/lon (no tiles); tap a ride to select it
  const lats = R.map((r) => r[1]), lons = R.map((r) => r[2]);
  const lat0 = (Math.min(...lats) + Math.max(...lats)) / 2, k = Math.cos(lat0 * Math.PI / 180);
  const minX = Math.min(...lons) * k, maxX = Math.max(...lons) * k, minY = -Math.max(...lats), maxY = -Math.min(...lats);
  const W = 360, pad = 16, s = (W - 2 * pad) / Math.max(maxX - minX, 1e-9), H = Math.round((maxY - minY) * s + 2 * pad);
  const px = (r) => [pad + (r[2] * k - minX) * s, pad + (-r[1] - minY) * s];
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Map of rides: color shows the wait now");
  const sv = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const [a, v] of Object.entries(attrs)) n.setAttribute(a, v); return n; };
  if (D.at != null && target) {
    const [x1, y1] = px(R[D.at]), [x2, y2] = px(target);
    svg.append(sv("line", { x1, y1, x2, y2, stroke: "var(--accent)", "stroke-width": 2, "stroke-dasharray": "5 4" }));
  }
  const labels = [];
  R.forEach((r, i) => {
    const [x, y] = px(r);
    const g = sv("g", { tabindex: 0, style: "cursor:pointer" });
    const big = i === D.next || i === D.at || i === D.book;
    g.append(sv("circle", { cx: x, cy: y, r: 11, fill: "transparent" }));  // a bigger tap target
    const hollow = r[5].includes("d") || (r[4] === "O" && r[3] == null);  // done, or no posted wait (shows, walkthroughs)
    g.append(sv("circle", { cx: x, cy: y, r: big ? 7 : 5, fill: hollow ? "var(--bg)" : color(r),
                           stroke: big ? "var(--fg)" : color(r), "stroke-width": big ? 2.5 : 1.5 }));
    const t = sv("title", {}); t.textContent = desc(r); g.append(t);
    g.onclick = g.onkeydown = (ev) => { if (ev.type === "keydown" && ev.key !== "Enter") return; pick.value = String(i); pick.dispatchEvent(new Event("change")); };
    svg.append(g);
    if (big) labels.push([x, y, (i === D.next ? "Next: " : i === D.at ? "You: " : "Book: ") + r[0]]);
  });
  labels.forEach(([x, y, txt]) => {
    const lt = sv("text", { x: Math.min(x + 9, W - 4), y: y - 9, "font-size": 11, fill: "var(--fg)",
                           "text-anchor": x > W * 0.6 ? "end" : "start", "paint-order": "stroke",
                           stroke: "var(--bg)", "stroke-width": 3 });
    lt.textContent = txt.length > 34 ? txt.slice(0, 33) + "…" : txt;
    svg.append(lt);
  });
  const mapCard = el("div", { class: "card" });
  const legend = el("div", { class: "legend" });
  [["var(--lo)", "under 20 min"], ["var(--mid)", "20–39"], ["var(--hi)", "40+"], ["var(--off)", "closed / down"],
   ["hollow", "no posted wait or done"]]
    .forEach(([c, t]) => { const sp = el("span");
      sp.append(el("i", { style: c === "hollow" ? "border:1.5px solid var(--muted);width:7px;height:7px" : `background:${c}` }),
                document.createTextNode(t)); legend.append(sp); });
  mapCard.append(svg, legend);

  // what did you just do?
  const act = el("div", { class: "card" });
  act.append(el("b", {}, "Where are you, what did you just do?"));
  const pick = el("select", { id: "ride", "aria-label": "Ride" });
  pick.append(el("option", { value: "" }, "Choose a ride (or tap it on the map)"));
  R.map((r, i) => [r, i]).sort((a, b) => a[0][0].localeCompare(b[0][0]))
    .forEach(([r, i]) => pick.append(el("option", { value: String(i) }, desc(r))));
  if (D.next != null) pick.value = String(D.next);
  const time = el("input", { type: "time", id: "ret", "aria-label": "Multi Pass return time" });
  const btn = (label, fn, ghost) => { const b = el("button", ghost ? { class: "ghost" } : {}, label); b.onclick = fn; return b; };
  const chosen = () => pick.value === "" ? null : R[Number(pick.value)][0];
  const need = (fn) => () => { const n = chosen(); if (!n) { out.textContent = "Choose a ride first."; return; } fn(n); };
  const row1 = el("div", { class: "row" });
  row1.append(btn("Rode it", need((n) => send(`did ${n}`))), btn("Used Lightning Lane", need((n) => send(`used ${n}`))));
  const row2 = el("div", { class: "row" });
  row2.append(time, btn("Booked Multi Pass", need((n) => {
    if (!time.value) { out.textContent = "Set the return time on your Multi Pass first."; return; }
    send(`booked ${n} ${time.value}`);
  })));
  const row3 = el("div", { class: "row" });
  row3.append(btn("Skip ride", need((n) => send(`skip ${n}`)), true), btn("Lunch done", () => send("lunch done"), true),
              btn("Refresh plan", () => send("plan"), true));
  const out = el("div", { id: "out" });
  act.append(pick, row1, row2, row3, out);
  pick.onchange = () => { out.textContent = pick.value === "" ? "" : desc(R[Number(pick.value)]); };

  app.replaceChildren(head, plan, mapCard, act);
})();
</script>
</body>
</html>
