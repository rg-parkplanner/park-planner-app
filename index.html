<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Park planner</title>
<script>window.__planHash = location.hash;  // before Telegram's script, which reads and may rewrite the hash</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* Telegram Mini App for the parkcollector day-of planner. Static: the plan arrives in the URL
   fragment (never sent to this host) and choices go back to the bot via WebApp.sendData. */
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --fg: var(--tg-theme-text-color, #16202c);
  --muted: var(--tg-theme-hint-color, #6b7686);
  --card: var(--tg-theme-secondary-bg-color, #f2f4f7);
  --accent: var(--tg-theme-button-color, #2f6fde);
  --on-accent: var(--tg-theme-button-text-color, #ffffff);
  --lo: #2e9b5e; --mid: #d99a1e; --hi: #d1493f; --off: #9aa3af;
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-tg]) {
  --bg: #12161c; --fg: #e8ecf1; --muted: #9aa3af; --card: #1c222b; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--fg); }
.wrap { padding: 12px max(14px, env(safe-area-inset-left)) 28px max(14px, env(safe-area-inset-right));
  display: grid; gap: 12px; max-width: 560px; margin: 0 auto; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.head b { font-size: 17px; } .sub { color: var(--muted); font-size: 13px; }
.card { background: var(--card); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.next { font-size: 17px; font-weight: 600; }
ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.warn { color: var(--hi); font-size: 13px; }
svg.dotmap { width: 100%; height: auto; display: block; touch-action: manipulation; }  /* not Leaflet's svg */
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select, input[type=time] { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--muted);
  background: var(--bg); color: var(--fg); min-width: 0; }
select { flex: 1 1 100%; }
button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer;
  background: var(--accent); color: var(--on-accent); flex: 1 1 auto; }
button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
#out { font-size: 13px; color: var(--muted); word-break: break-word; }
#map, #imap { height: 340px; border-radius: 10px; z-index: 0; }
.steps { display: grid; gap: 2px; }
.step { display: grid; grid-template-columns: 4.6em 1fr auto; gap: 8px; align-items: baseline; padding: 5px 0;
  border-bottom: 1px solid color-mix(in srgb, var(--muted) 25%, transparent); }
.step .k { color: var(--muted); font-size: 12px; display: block; }
.chip { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 9px; color: #fff; white-space: nowrap; }
input[type=date] { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--muted);
  background: var(--bg); color: var(--fg); min-width: 0; flex: 1 1 9em; }
.pin { border-radius: 50%; box-sizing: border-box; cursor: pointer; position: relative; }
.pin .lbl, .num { font: 600 11px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.pin .lbl { position: absolute; bottom: 140%; left: 50%; transform: translateX(-50%); white-space: nowrap;
  background: var(--bg); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.3);
  padding: 2px 6px; border-radius: 6px; pointer-events: none; }
.num { width: 20px; height: 20px; border-radius: 50%; color: #fff; text-align: center; line-height: 20px;
  border: 2px solid #fff; cursor: pointer; }
a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="sub">Loading the plan…</div></div>
<script>
(async function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  // initData is empty when a Mini App is opened from a keyboard button (our "Open planner"), so detect
  // Telegram by its platform instead; sendData works there.
  const inTelegram = !!(tg && tg.platform && tg.platform !== "unknown");
  if (inTelegram) { document.documentElement.setAttribute("data-tg", ""); tg.ready(); tg.expand(); }
  const app = document.getElementById("app");
  const el = (tag, attrs = {}, text) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text != null) n.textContent = text;
    return n;
  };
  const fail = (msg, details) => {
    const card = el("div", { class: "card" }, msg);
    if (details && inTelegram) {  // lets the owner see what this phone actually received
      const b = el("button", {}, "Send details to bot");
      b.onclick = () => tg.sendData("pagedebug " + details);
      card.append(b);
    }
    app.replaceChildren(card);
  };
  const raw = window.__planHash || "";
  const details = () => [`len=${raw.length}`, `head=${raw.slice(0, 24)}`, `p=${raw.indexOf("p=")}`,
    `tgParams=${raw.includes("tgWebApp")}`, `nowHash=${location.hash.length}`, `search=${location.search}`,
    `ds=${typeof DecompressionStream}`, `tg=${tg ? tg.version + "/" + tg.platform : "none"}`].join(" ");

  // The plan is "p" in the URL fragment; Telegram appends its own launch parameters (&tgWebAppData=...).
  function readPayload(hash) {
    const h = (hash || "").replace(/^#/, "");
    const p = new URLSearchParams(h).get("p");
    return p || (h && !h.includes("=") ? h.split("&")[0] : "");
  }
  async function inflateRaw(bytes) {
    if (typeof DecompressionStream !== "undefined") {
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return await new Response(stream).text();
    }
    if (!window.pako) await new Promise((ok, bad) => {  // older phone browsers: a small inflate library
      const sc = document.createElement("script");
      sc.src = "https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako_inflate.min.js";
      sc.onload = ok; sc.onerror = () => bad(new Error("couldn't load the decompressor"));
      document.head.append(sc);
    });
    return window.pako.inflateRaw(bytes, { to: "string" });
  }
  async function decode(frag) {
    const b64 = frag.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((frag.length + 3) % 4);
    const bytes = Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0));
    return JSON.parse(await inflateRaw(bytes));
  }
  const frag = readPayload(window.__planHash || location.hash);
  if (!frag) return fail("Open this page from the planner bot's button: it carries your current plan.", details());
  let D;
  try { D = await decode(frag); } catch (e) {
    return fail(`Couldn't read the plan in this link (${e && e.message ? e.message : e}; ${frag.length} chars). ` +
                "Send plan to the bot for a fresh one.", details() + ` err=${e && e.message ? e.message : e}`);
  }

  // "Plan a day": a date from the calendar and a park; the bot builds the itinerary
  const PARKS = [["DL", "Disneyland Park"], ["DCA", "California Adventure"], ["MK", "Magic Kingdom"],
                 ["EP", "EPCOT"], ["HS", "Hollywood Studios"], ["AK", "Animal Kingdom"]];
  const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  function dayPicker(title, dflt, park) {
    const card = el("div", { class: "card" });
    card.append(el("b", {}, title));
    const today = new Date(), tomorrow = new Date(today.getTime() + 864e5), max = new Date(today.getTime() + 365 * 864e5);
    const d = el("input", { type: "date", id: "day", min: iso(today), max: iso(max), value: dflt || iso(tomorrow),
                            "aria-label": "Date" });
    const ps = el("select", { id: "dpark", "aria-label": "Park" });
    PARKS.forEach(([k, n]) => ps.append(el("option", { value: k }, n)));
    ps.value = park || "DL";
    const msg = el("div", { class: "sub" });
    const go = el("button", {}, "Make itinerary");
    go.onclick = () => {
      if (!d.value) { msg.textContent = "Pick a date first."; return; }
      const cmd = `itinerary ${d.value} ${ps.value}`;
      if (inTelegram) tg.sendData(cmd); else msg.textContent = "Send this to the bot: " + cmd;
    };
    const row = el("div", { class: "row" }); row.append(d, go);
    card.append(row, ps, msg, el("div", { class: "sub" }, "The bot replies in a few seconds; then tap Open itinerary."));
    return card;
  }

  // Base map: OpenFreeMap's Liberty style (OpenStreetMap data, MapLibre; free, no key), as in GRAZE
  // (graze.milesmaximizer.com), including GRAZE's dark repaint. The on-map credit is hidden on purpose
  // (private, personal page). Credit: OpenFreeMap, (c) OpenMapTiles, data (c) OpenStreetMap contributors.
  const MAP_STYLE = "https://tiles.openfreemap.org/styles/liberty";
  const DK = { land: "#1f2530", residential: "rgba(255, 255, 255, 0.035)", green: "#1c2a2a", water: "#0e1b2c",
    waterLine: "#1b3452", sand: "#262c35", building: "#29303c", buildingLine: "#323a47", aeroway: "#2a313c",
    path: "#3b4453", minor: "#3a4352", minorCasing: "#272e39", secondary: "#4c5667", primary: "#5d687a",
    primaryCasing: "#2e3541", motorway: "#8792a5", motorwayCasing: "#3a4250", rail: "#3a4250",
    boundary: "#56627a", boundaryState: "#424d60", label: "#e8ebf0", labelSoft: "#c1c8d2", labelDim: "#8f99a8",
    waterLabel: "#6487b0", roadLabel: "#b2bbc7", halo: "#161b23" };
  const DARK_PAINT = [  // [layer id pattern, paint overrides]; the first match wins
    [/^background$/, { "background-color": DK.land }],
    [/^natural_earth$/, { "raster-brightness-max": 0.32, "raster-saturation": -0.7 }],
    [/^park_outline$/, { "line-color": DK.green }],
    [/^(park|landcover_wood|landcover_grass|landuse_cemetery|landuse_pitch|landuse_track)$/, { "fill-color": DK.green, "fill-outline-color": DK.green }],
    [/^landuse_residential$/, { "fill-color": DK.residential }],
    [/^landcover_(ice|sand)$/, { "fill-color": DK.sand }],
    [/^landcover_wetland$/, { "fill-opacity": 0.15 }],
    [/^landuse_(hospital|school)$/, { "fill-color": DK.sand }],
    [/^waterway/, { "line-color": DK.waterLine }],
    [/^water$/, { "fill-color": DK.water }],
    [/^aeroway_fill$/, { "fill-color": DK.aeroway }],
    [/^aeroway_/, { "line-color": DK.path }],
    [/^road_area_pattern$/, { "fill-opacity": 0.08 }],
    [/motorway(_link)?_casing$/, { "line-color": DK.motorwayCasing }],
    [/(trunk_primary|secondary_tertiary|link)_casing$/, { "line-color": DK.primaryCasing }],
    [/(street|minor|service_track)_casing$/, { "line-color": DK.minorCasing }],
    [/path_pedestrian_casing$/, { "line-color": DK.minorCasing }],
    [/^(road|tunnel|bridge)_motorway(_link)?$/, { "line-color": DK.motorway }],
    [/^(road|tunnel|bridge)_trunk_primary$/, { "line-color": DK.primary }],
    [/^(road|tunnel|bridge)_(secondary_tertiary|link)$/, { "line-color": DK.secondary }],
    [/^(road|tunnel|bridge)_(minor|street|service_track)$/, { "line-color": DK.minor }],
    [/^(road|tunnel|bridge)_path_pedestrian$/, { "line-color": DK.path }],
    [/_(major|transit)_rail(_hatching)?$/, { "line-color": DK.rail }],
    [/^building$/, { "fill-color": DK.building, "fill-outline-color": DK.buildingLine }],
    [/^building-3d$/, { "fill-extrusion-color": DK.building, "fill-extrusion-opacity": 0.6 }],
    [/^boundary_3$/, { "line-color": DK.boundaryState }],
    [/^boundary_/, { "line-color": DK.boundary }],
    [/^(waterway_line_label|water_name_)/, { "text-color": DK.waterLabel, "text-halo-color": DK.water }],
    [/^poi_/, { "text-color": DK.labelDim, "text-halo-color": DK.halo, "icon-opacity": 0.75 }],
    [/^highway-name-/, { "text-color": DK.roadLabel, "text-halo-color": DK.halo, "text-halo-width": 1 }],
    [/^airport$/, { "text-color": DK.labelDim, "text-halo-color": DK.halo }],
    [/^label_(city|city_capital|country_\d)$/, { "text-color": DK.label, "text-halo-color": DK.halo }],
    [/^label_(town|village)$/, { "text-color": DK.labelSoft, "text-halo-color": DK.halo }],
    [/^label_(state|other)$/, { "text-color": DK.labelDim, "text-halo-color": DK.halo }],
  ];
  const PAINT_PREFIX = { background: ["background-"], fill: ["fill-"], line: ["line-"], symbol: ["text-", "icon-"],
                         raster: ["raster-"], "fill-extrusion": ["fill-extrusion-"] };
  const paintFits = (type, prop) => (PAINT_PREFIX[type] || []).some((x) => prop.startsWith(x))
                                    && !(type === "fill" && prop.startsWith("fill-extrusion-"));
  function darkStyle(style) {
    return { ...style, layers: style.layers.map((l) => {
      const rule = DARK_PAINT.find(([re]) => re.test(l.id));
      if (!rule) return l;
      const paint = { ...l.paint };
      for (const [k, v] of Object.entries(rule[1])) if (paintFits(l.type, k)) paint[k] = v;
      const out = { ...l, paint };
      const icon = l.layout && JSON.stringify(l.layout["icon-image"] || "");
      if (icon && icon.includes("circle_11_black"))  // dark dots vanish on a dark map
        out.layout = { ...l.layout, "icon-image": JSON.parse(icon.replaceAll("circle_11_black", "circle_11")) };
      return out;
    }) };
  }
  const isDark = () => inTelegram ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const hasMap = !!window.maplibregl;
  function newMap(div, pts, pad = 24) {  // pts: [[lat, lon], ...] to frame
    if (isDark()) document.documentElement.classList.add("dark");
    const lons = pts.map((x) => x[1]), lats = pts.map((x) => x[0]);
    const m = new maplibregl.Map({ container: div,
      bounds: [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
      fitBoundsOptions: { padding: pad }, attributionControl: false, dragRotate: false, pitchWithRotate: false });
    m.touchZoomRotate.disableRotation();
    m.setStyle(MAP_STYLE, isDark() ? { transformStyle: (prev, next) => darkStyle(next) } : {});
    setTimeout(() => m.resize(), 250);  // Telegram can resize the page as it expands
    return m;
  }
  const lineLayer = (m, id, coords, color, dash) => m.on("load", () => {
    m.addSource(id, { type: "geojson", data: { type: "Feature", geometry: { type: "LineString", coordinates: coords } } });
    m.addLayer({ id, type: "line", source: id, paint: Object.assign({ "line-color": color, "line-width": 3, "line-opacity": 0.75 },
                                                                      dash ? { "line-dasharray": [2, 2] } : {}) });
  });

  if (D.itin) {  // opened from "Open itinerary"
    const I = D.itin;
    const KIND = { B: "Book Multi Pass", L: "Lightning Lane", S: "Standby", W: "Show / play", M: "Break", F: "Free time" };
    const wcol = (w) => w < 20 ? "var(--lo)" : w < 40 ? "var(--mid)" : "var(--hi)";
    const ih = el("div", { class: "head" });
    ih.append(el("b", {}, I.name), el("span", { class: "sub" }, I.day));
    const info = el("div", { class: "card" });
    info.append(el("div", {}, [`Park ${I.hours}`, I.crowd ? `crowd ${I.crowd.toFixed(2)}\u00d7 typical` : "",
                               I.ticket ? `ticket $${I.ticket}` : "", `child ${I.child} in`].filter(Boolean).join(" \u00b7 ")));
    I.notes.forEach(([label, text]) => { const n = el("div", { class: "sub" }); n.append(el("b", {}, label + ": "), document.createTextNode(text)); info.append(n); });
    if (I.replay) info.append(el("div", { class: "sub" }, I.replay));
    const list = el("div", { class: "card steps" });
    I.steps.forEach(([t, k, name, wait]) => {
      const row = el("div", { class: "step" });
      const mid = el("div"); mid.append(el("span", { class: "k" }, KIND[k] || k), document.createTextNode(name));
      const chip = wait != null ? el("span", { class: "chip", style: `background:${wcol(wait)}` }, `${wait} min`)
                 : k === "L" ? el("span", { class: "chip", style: "background:var(--lo)" }, "~10 min") : el("span");
      row.append(el("span", { class: "sub" }, t), mid, chip);
      list.append(row);
    });
    const parts = [ih, info, list];
    const pts = I.steps.filter((x) => x[4] != null);
    let imapDiv = null;
    if (hasMap && pts.length) { imapDiv = el("div", { id: "imap" }); const mc = el("div", { class: "card" }); mc.append(imapDiv); parts.push(mc); }
    parts.push(dayPicker("Plan another day", I.date, I.park));
    app.replaceChildren(...parts);
    if (imapDiv) {  // the day's route, numbered in order
      try {
        const css = getComputedStyle(document.documentElement);
        const m = newMap(imapDiv, pts.map((x) => [x[4], x[5]]));
        lineLayer(m, "route", pts.map((x) => [x[5], x[4]]), css.getPropertyValue("--accent").trim(), false);
        pts.forEach((x, i) => {
          const d = el("div", { class: "num", style: `background:${x[1] === "L" ? "#2e9b5e" : "#2f6fde"}` }, String(i + 1));
          new maplibregl.Marker({ element: d }).setLngLat([x[5], x[4]])
            .setPopup(new maplibregl.Popup({ offset: 12, closeButton: false }).setText(`${i + 1}. ${x[0]} ${x[2]}`)).addTo(m);
        });
      } catch (err) { imapDiv.parentNode.remove(); }  // no WebGL: the list above is the itinerary
    }
    return;
  }

  const R = D.rides;  // [name, lat, lon, wait, state, flags]
  const send = (cmd) => {
    if (inTelegram) { tg.sendData(cmd); return; }  // the bot replies with a fresh plan; Telegram closes the page
    out.textContent = "Send this to the bot: " + cmd;
  };
  const color = (r) => r[4] !== "O" ? "var(--off)" : r[3] == null ? "var(--muted)" :
    r[3] < 20 ? "var(--lo)" : r[3] < 40 ? "var(--mid)" : "var(--hi)";
  const desc = (r) => r[0] + (r[4] === "D" ? " (down)" : r[4] === "C" ? " (closed)" : r[3] != null ? ` · ${r[3]} min` : "")
    + (r[5].includes("d") ? " · done" : "") + (r[5].includes("h") ? " · holding LL" : "") + (r[5].includes("t") ? " · too tall" : "");

  // header + plan
  const head = el("div", { class: "head" });
  head.append(el("b", {}, { DL: "Disneyland Park", DCA: "Disney California Adventure" }[D.park] || D.park),
              el("span", { class: "sub" }, `${D.time} · lines ${D.ratio.toFixed(2)}× typical`));
  const plan = el("div", { class: "card" });
  if (D.age == null) plan.append(el("div", { class: "warn" }, "No live data yet: waits are typical, not live."));
  else if (D.age > 15) plan.append(el("div", { class: "warn" }, `Live data is ${D.age} min old: waits may have moved.`));
  plan.append(el("div", { class: "next" }, D.steps[0] || "Nothing left that fits before you leave."));
  if (D.steps.length > 1) {
    const ol = el("ol", { start: "2" });
    D.steps.slice(1).forEach((s) => ol.append(el("li", {}, s)));
    plan.append(ol);
  }
  const target = D.next != null ? R[D.next] : null;
  if (target) {
    // Directions on the page itself: maps-app links (Google Maps) redirect to an app scheme that
    // Telegram's in-app browser can't open (ERR_UNKNOWN_URL_SCHEME).
    const from = D.at != null ? R[D.at] : null;
    if (from && from !== target) {
      const rad = Math.PI / 180, dLat = (target[1] - from[1]) * rad, dLon = (target[2] - from[2]) * rad;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(from[1] * rad) * Math.cos(target[1] * rad) * Math.sin(dLon / 2) ** 2;
      const m = 2 * 6371000 * Math.asin(Math.sqrt(h));
      const mins = Math.round(2 + m * 1.4 / 55);  // the planner's pace with a 5-year-old, path detours included
      const y = Math.sin(dLon) * Math.cos(target[1] * rad);
      const x = Math.cos(from[1] * rad) * Math.sin(target[1] * rad) - Math.sin(from[1] * rad) * Math.cos(target[1] * rad) * Math.cos(dLon);
      const dir = ["north", "northeast", "east", "southeast", "south", "southwest", "west", "northwest"][
        Math.round(((Math.atan2(y, x) / rad + 360) % 360) / 45) % 8];
      plan.append(el("div", {}, `To ${target[0]}: about ${Math.round(m / 10) * 10} m, ${mins} min walk, ${dir} of ${from[0]}.`));
    }
    // Google Maps. Default: open the walking route directly (hands off to the Maps app when
    // Telegram opens links outside its in-app browser). Second: the bot sends a location pin,
    // whose map hands off to Google Maps even with the in-app browser on.
    const gmaps = `https://www.google.com/maps/dir/?api=1&destination=${target[1]},${target[2]}&travelmode=walking`;
    const open = el("button", {}, "Open in Google Maps");
    open.onclick = () => { if (inTelegram) tg.openLink(gmaps); else window.open(gmaps, "_blank", "noopener"); };
    const pin = el("button", { class: "ghost" }, "Directions in Google Maps");
    pin.onclick = () => { if (inTelegram) tg.sendData(`where ${target[0]}`); else location.href = gmaps; };
    const r1 = el("div", { class: "row" }), r2 = el("div", { class: "row" });
    r1.append(open); r2.append(pin);
    plan.append(r1, r2, el("div", { class: "sub" },
      "Directions sends a map pin to the chat: tap it, then Directions. Use it if Open shows an error."));
  }
  if (D.held.length) plan.append(el("div", { class: "sub" }, "Holding: " + D.held.map((h) => `${R[h[0]][0]} ${h[1]}–${h[2]}`).join("; ")));
  if (D.nb) plan.append(el("div", { class: "sub" }, `Next Multi Pass booking opens ${D.nb}${D.held.length ? ", or when you tap in" : ""}.`));
  if (D.sold.length) plan.append(el("div", { class: "sub" }, "Multi Pass sold out today: " + D.sold.join(", ")));

  // map: rides projected from lat/lon (no tiles); tap a ride to select it
  const lats = R.map((r) => r[1]), lons = R.map((r) => r[2]);
  const lat0 = (Math.min(...lats) + Math.max(...lats)) / 2, k = Math.cos(lat0 * Math.PI / 180);
  const minX = Math.min(...lons) * k, maxX = Math.max(...lons) * k, minY = -Math.max(...lats), maxY = -Math.min(...lats);
  const W = 360, pad = 16, s = (W - 2 * pad) / Math.max(maxX - minX, 1e-9), H = Math.round((maxY - minY) * s + 2 * pad);
  const px = (r) => [pad + (r[2] * k - minX) * s, pad + (-r[1] - minY) * s];
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("class", "dotmap");
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Map of rides: color shows the wait now");
  const sv = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const [a, v] of Object.entries(attrs)) n.setAttribute(a, v); return n; };
  if (D.at != null && target) {
    const [x1, y1] = px(R[D.at]), [x2, y2] = px(target);
    svg.append(sv("line", { x1, y1, x2, y2, stroke: "var(--accent)", "stroke-width": 2, "stroke-dasharray": "5 4" }));
  }
  const labels = [];
  R.forEach((r, i) => {
    const [x, y] = px(r);
    const g = sv("g", { tabindex: 0, style: "cursor:pointer" });
    const big = i === D.next || i === D.at || i === D.book;
    g.append(sv("circle", { cx: x, cy: y, r: 11, fill: "transparent" }));  // a bigger tap target
    const hollow = r[5].includes("d") || (r[4] === "O" && r[3] == null);  // done, or no posted wait (shows, walkthroughs)
    g.append(sv("circle", { cx: x, cy: y, r: big ? 7 : 5, fill: hollow ? "var(--bg)" : color(r),
                           stroke: big ? "var(--fg)" : color(r), "stroke-width": big ? 2.5 : 1.5 }));
    const t = sv("title", {}); t.textContent = desc(r); g.append(t);
    g.onclick = g.onkeydown = (ev) => { if (ev.type === "keydown" && ev.key !== "Enter") return; pick.value = String(i); pick.dispatchEvent(new Event("change")); };
    svg.append(g);
    if (big) labels.push([x, y, (i === D.next ? "Next: " : i === D.at ? "You: " : "Book: ") + r[0]]);
  });
  labels.forEach(([x, y, txt]) => {
    const lt = sv("text", { x: Math.min(x + 9, W - 4), y: y - 9, "font-size": 11, fill: "var(--fg)",
                           "text-anchor": x > W * 0.6 ? "end" : "start", "paint-order": "stroke",
                           stroke: "var(--bg)", "stroke-width": 3 });
    lt.textContent = txt.length > 34 ? txt.slice(0, 33) + "…" : txt;
    svg.append(lt);
  });
  const mapCard = el("div", { class: "card" });
  const mapDiv = el("div", { id: "map", role: "img", "aria-label": "Map of rides: color shows the wait now" });
  const legend = el("div", { class: "legend" });
  [["var(--lo)", "under 20 min"], ["var(--mid)", "20–39"], ["var(--hi)", "40+"], ["var(--off)", "closed / down"],
   ["hollow", "no posted wait or done"]]
    .forEach(([c, t]) => { const sp = el("span");
      sp.append(el("i", { style: c === "hollow" ? "border:1.5px solid var(--muted);width:7px;height:7px" : `background:${c}` }),
                document.createTextNode(t)); legend.append(sp); });
  mapCard.append(hasMap ? mapDiv : svg, legend);  // OpenStreetMap (MapLibre) when it loaded, else the dot map

  // what did you just do?
  const act = el("div", { class: "card" });
  act.append(el("b", {}, "Where are you, what did you just do?"));
  const pick = el("select", { id: "ride", "aria-label": "Ride" });
  pick.append(el("option", { value: "" }, "Choose a ride (or tap it on the map)"));
  R.map((r, i) => [r, i]).sort((a, b) => a[0][0].localeCompare(b[0][0]))
    .forEach(([r, i]) => pick.append(el("option", { value: String(i) }, desc(r))));
  if (D.next != null) pick.value = String(D.next);
  const time = el("input", { type: "time", id: "ret", "aria-label": "Multi Pass return time" });
  const btn = (label, fn, ghost) => { const b = el("button", ghost ? { class: "ghost" } : {}, label); b.onclick = fn; return b; };
  const chosen = () => pick.value === "" ? null : R[Number(pick.value)][0];
  const need = (fn) => () => { const n = chosen(); if (!n) { out.textContent = "Choose a ride first."; return; } fn(n); };
  const row1 = el("div", { class: "row" });
  row1.append(btn("Rode it", need((n) => send(`did ${n}`))), btn("Used Lightning Lane", need((n) => send(`used ${n}`))));
  const row2 = el("div", { class: "row" });
  row2.append(time, btn("Booked Multi Pass", need((n) => {
    if (!time.value) { out.textContent = "Set the return time on your Multi Pass first."; return; }
    send(`booked ${n} ${time.value}`);
  })));
  const row3 = el("div", { class: "row" });
  row3.append(btn("Skip ride", need((n) => send(`skip ${n}`)), true), btn("Lunch done", () => send("lunch done"), true),
              btn("Refresh plan", () => send("plan"), true));
  const out = el("div", { id: "out" });
  act.append(pick, row1, row2, row3, out);
  pick.onchange = () => { out.textContent = pick.value === "" ? "" : desc(R[Number(pick.value)]); };

  app.replaceChildren(head, plan, mapCard, act, dayPicker("Plan a day", null, D.park));

  // OpenStreetMap base map (MapLibre), drawn once the container is in the page so it has a size
  if (hasMap) {
    try {
      const css = getComputedStyle(document.documentElement);
      const col = (r) => { const v = color(r).match(/var\((--[a-z]+)\)/); return v ? css.getPropertyValue(v[1]).trim() : "#888"; };
      const bg = css.getPropertyValue("--bg").trim() || "#fff", fg = css.getPropertyValue("--fg").trim() || "#000";
      const map = newMap(mapDiv, R.map((r) => [r[1], r[2]]), 18);
      if (target) map.jumpTo({ center: [target[2], target[1]], zoom: Math.max(map.getZoom(), 16.5) });  // near the next ride
      if (D.at != null && target) lineLayer(map, "walk", [[R[D.at][2], R[D.at][1]], [target[2], target[1]]],
                                            css.getPropertyValue("--accent").trim(), true);
      R.forEach((r, i) => {
        const big = i === D.next || i === D.at || i === D.book;
        const hollow = r[5].includes("d") || (r[4] === "O" && r[3] == null);
        const size = big ? 18 : 14;
        const d = el("div", { class: "pin", style: `width:${size}px;height:${size}px;background:${hollow ? bg : col(r)};` +
                                                   `border:${big ? 3 : 2}px solid ${big ? fg : col(r)}` });
        if (big) d.append(el("span", { class: "lbl" }, (i === D.next ? "Next: " : i === D.at ? "You: " : "Book: ") + r[0]));
        d.addEventListener("click", () => { pick.value = String(i); pick.dispatchEvent(new Event("change")); });
        new maplibregl.Marker({ element: d }).setLngLat([r[2], r[1]])
          .setPopup(new maplibregl.Popup({ offset: 10, closeButton: false }).setText(desc(r))).addTo(map);  // text, never HTML
      });
    } catch (err) { mapDiv.replaceWith(svg); }  // no WebGL: the dot map
  }
})();
</script>
</body>
</html>
