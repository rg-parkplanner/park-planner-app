<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Park status</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 24px 16px; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #fff; color: #16202c; }
  @media (prefers-color-scheme: dark) { body { background: #12161c; color: #e8ecf1; } }
</style>
</head>
<body>
<p id="msg">Opening the status page...</p>
<script>
// The parkplanner dashboard, sent by the Telegram bot's "status" command. This file and the
// ciphertext next to it (status.bin) hold nothing readable: the key is in the link after "#",
// which browsers never send to the host. Decrypt (AES-256-GCM), gunzip, then show the same HTML.
const AAD = "parkplanner-status";  // must match status_page.AAD

function b64url(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  return Uint8Array.from(atob(s + "=".repeat((4 - s.length % 4) % 4)), (c) => c.charCodeAt(0));
}

async function unseal(buf, k) {  // buf: nonce (12 bytes) + ciphertext; k: base64url key
  const key = await crypto.subtle.importKey("raw", b64url(k), "AES-GCM", false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12), additionalData: new TextEncoder().encode(AAD) },
                                         key, buf.slice(12));
  return await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}

const keyFrom = (hash) => new URLSearchParams(hash.replace(/^#/, "")).get("k");  // Telegram appends &tgWebApp...

if (typeof document !== "undefined") (async () => {
  const say = (t) => { document.getElementById("msg").textContent = t; };
  const k = keyFrom(location.hash);
  if (!k) return say("This link has no key. Send status to the bot for a fresh one.");
  try {
    const b = new URLSearchParams(location.search).get("b") || String(Date.now());
    const r = await fetch("status.bin?b=" + encodeURIComponent(b), { cache: "no-store" });
    if (!r.ok) throw new Error("download failed (" + r.status + ")");
    const html = await unseal(new Uint8Array(await r.arrayBuffer()), k);
    document.open(); document.write(html); document.close();
  } catch (e) {
    say(e && e.name === "OperationError" ? "This status link is out of date. Send status to the bot for a fresh one."
                                         : "Couldn't open the status page: " + e);
  }
})();
</script>
</body>
</html>
